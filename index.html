<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northstar CRM</title>
<style>
:root{
  --bg:#f5f5f3;--panel:#fff;--panel-2:#fafaf8;--hover:#f0f0ed;--text:#1d1d1f;--muted:#6e6e73;--border:#e4e4e0;
  --accent:#2f6fed;--accent-weak:#e8efff;--danger:#d93f3f;--success:#1e9e5a;--warn:#c27c00;
  --canvas:#ecebe6;--dot:#cfcec8;--card:#fff;--col-bg:#e2e1dc;--line:#86868c;
  --shadow:0 1px 2px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 12px 32px rgba(0,0,0,.18);
  --t-red:#fdeaea;--t-orange:#feeedd;--t-yellow:#fff5c9;--t-green:#e3f5ea;--t-teal:#ddf4f0;--t-blue:#e6edfe;--t-purple:#f1e8fb;--t-pink:#fce7f2;--t-gray:#ececee;
  --cc-red:#e5484d;--cc-orange:#f76b15;--cc-yellow:#e2b203;--cc-green:#30a46c;--cc-teal:#12a594;--cc-blue:#3e63dd;--cc-purple:#8e4ec6;--cc-pink:#d6409f;--cc-gray:#8b8d98;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141416;--panel:#1c1c1f;--panel-2:#202024;--hover:#26262b;--text:#ececef;--muted:#9b9ba3;--border:#2e2e33;
  --accent:#6b9bff;--accent-weak:#1d2a47;--danger:#ff6b6b;--success:#3ccf85;--warn:#f0b13c;
  --canvas:#18181b;--dot:#2c2c31;--card:#232327;--col-bg:#2a2a2f;--line:#8e8e96;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
  --t-red:#3b1d1f;--t-orange:#3a2414;--t-yellow:#352d0e;--t-green:#15301f;--t-teal:#102f2b;--t-blue:#1b2545;--t-purple:#2b1e3d;--t-pink:#3a1b2e;--t-gray:#2c2c31;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416;--panel:#1c1c1f;--panel-2:#202024;--hover:#26262b;--text:#ececef;--muted:#9b9ba3;--border:#2e2e33;
    --accent:#6b9bff;--accent-weak:#1d2a47;--danger:#ff6b6b;--success:#3ccf85;--warn:#f0b13c;
    --canvas:#18181b;--dot:#2c2c31;--card:#232327;--col-bg:#2a2a2f;--line:#8e8e96;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
    --t-red:#3b1d1f;--t-orange:#3a2414;--t-yellow:#352d0e;--t-green:#15301f;--t-teal:#102f2b;--t-blue:#1b2545;--t-purple:#2b1e3d;--t-pink:#3a1b2e;--t-gray:#2c2c31;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
kbd{font:11px ui-monospace,monospace;background:var(--hover);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
#app{display:flex;height:100%}
/* nav */
#nav{width:224px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 16px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8e4ec6);display:grid;place-items:center;color:#fff;font-size:14px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item kbd{margin-left:auto}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:18px 10px 6px}
.nav-board{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 10px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--text);text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-board:hover{background:var(--hover)}
.nav-spacer{flex:1}
.save-state{font-size:11px;color:var(--muted);padding:8px 10px 0}
#main{flex:1;min-width:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:28px 32px 48px;display:none}
.view.active{display:block}
.view.notes{padding:0;overflow:hidden}
.view.notes.active{display:flex;flex-direction:column}
/* common ui */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
.page-head p{margin:0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
.panel h3{margin:0 0 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.panel h3 a,.linkish{color:var(--accent);font-weight:500;font-size:13px;cursor:pointer;background:none;border:0;padding:0}
input.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);outline:none}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea.inp{resize:vertical;min-height:70px}
.search-field{display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);min-width:240px}
.search-field input{border:0;outline:0;background:none;padding:8px 0;flex:1;min-width:0}
.search-field .ic{color:var(--muted);width:16px}
.list-tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.list-tools select{width:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--hover);color:var(--muted)}
.b-lead{background:var(--t-gray);color:var(--cc-gray)}.b-prospect,.b-qualified{background:var(--t-blue);color:var(--cc-blue)}.b-customer,.b-won{background:var(--t-green);color:var(--cc-green)}.b-churned,.b-lost{background:var(--t-red);color:var(--cc-red)}.b-proposal{background:var(--t-purple);color:var(--cc-purple)}.b-negotiation{background:var(--t-orange);color:var(--cc-orange)}
.b-high{background:var(--t-red);color:var(--cc-red)}.b-medium{background:var(--t-yellow);color:var(--warn)}.b-low{background:var(--t-gray);color:var(--cc-gray)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-weak);color:var(--accent);flex:none}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.lg{width:48px;height:48px;font-size:16px;border-radius:14px}
.avatar.kind-company{background:var(--t-teal);color:var(--cc-teal);border-radius:8px}
.avatar.kind-deal{background:var(--t-green);color:var(--cc-green);border-radius:8px}
.avatar .ic{width:16px;height:16px}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;background:var(--panel-2)}
.table th.sorted{color:var(--text)}
.table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer}
.table tbody tr:hover{background:var(--hover)}
.cell-name{display:flex;align-items:center;gap:10px}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .k-val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.bar-row{display:grid;grid-template-columns:96px 1fr 84px;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.bar{height:10px;background:var(--hover);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar-row b{text-align:right}
.mini-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.mini-row:last-child{border-bottom:0}
.mini-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row.overdue .due{color:var(--danger);font-weight:600}
.act-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--hover);flex:none;font-size:12px}
.board-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.board-tile{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel-2);text-align:left}
.board-tile:hover{border-color:var(--accent)}
.board-tile .bt-ic{font-size:22px}
.board-tile .bt-t{font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:200px}
.kcol.over{border-color:var(--accent);background:var(--accent-weak)}
.kcol-head{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 4px 10px}
.kcol-sum{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.kcol-body{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--accent)}
.kcard-title{font-weight:600;margin-bottom:2px}
.kcard-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cc-gray)}
.st-qualified{background:var(--cc-blue)}.st-proposal{background:var(--cc-purple)}.st-negotiation{background:var(--cc-orange)}.st-won{background:var(--cc-green)}.st-lost{background:var(--cc-red)}
/* tasks */
.task-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.task-add .inp:first-child{flex:1;min-width:200px}
.task-add .inp{width:auto}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13px}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.task-row:last-child{border-bottom:0}
.task-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.task-row .t-title{flex:1;min-width:120px;border:0;background:none;outline:0;padding:4px 0}
.task-row.done .t-title{text-decoration:line-through;color:var(--muted)}
.task-row .t-due{border:0;background:none;color:var(--muted);width:130px}
.task-row .t-due.overdue{color:var(--danger)}
.task-row select{border:0;background:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--hover);font-size:12px;cursor:pointer;border:0;white-space:nowrap}
.chip:hover{background:var(--accent-weak);color:var(--accent)}
.task-group{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.task-list{border:1px solid var(--border);border-radius:12px;overflow:hidden}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .2s ease;z-index:9000;display:flex;flex-direction:column}
#drawer.open{transform:none}
.drawer-head{display:flex;gap:14px;align-items:flex-start;padding:20px 20px 12px}
.drawer-head h2{margin:2px 0;font-size:20px}
.dh-text{flex:1;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.drawer-actions{display:flex;gap:8px;padding:0 20px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.drawer-body{overflow:auto;padding:4px 20px 30px;flex:1}
.drawer-body section{padding:16px 0;border-bottom:1px solid var(--border)}
.drawer-body section:last-child{border-bottom:0}
.drawer-body h3{font-size:13px;margin:0 0 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form-grid label.full{grid-column:1/-1}
.form-grid .inp{color:var(--text);font-size:14px}
.composer{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.composer-row{display:flex;gap:8px}
.composer-row select{width:auto}
.timeline-item{display:flex;gap:10px;padding:8px 0}
.timeline-item .ti-text{flex:1;font-size:13px;white-space:pre-wrap}
.timeline-item .ti-meta{font-size:11px;color:var(--muted);margin-top:2px}
.x-btn{border:0;background:none;color:var(--muted);cursor:pointer;opacity:.5;padding:2px 4px}
.x-btn:hover{opacity:1;color:var(--danger)}
/* modal */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:9500}
.modal-wrap{position:fixed;inset:0;background:rgba(10,10,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:min(440px,100%);padding:20px;max-height:80vh;overflow:auto}
.modal.wide{width:min(960px,100%);padding:0;max-height:86vh;display:flex;flex-direction:column}
.modal-wrap.top{padding-top:4vh}
.modal h2{margin:0 0 14px;font-size:17px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.search-modal{width:min(620px,100%);padding:0}
.search-modal .search-field{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:4px 16px}
.search-modal .search-field input{font-size:16px;padding:12px 0}
.search-results{max-height:52vh;overflow:auto;padding:6px}
.sr-group{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.sr-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.sr-item.on{background:var(--accent-weak)}
.sr-item .sr-t{font-weight:500}
.sr-item .sr-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-foot{font-size:12px;padding:10px 16px;border-top:1px solid var(--border)}
.pick-list{max-height:50vh;overflow:auto;margin-top:10px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tpl{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:var(--panel-2);text-align:left}
.tpl:hover{border-color:var(--accent)}
.tpl b{display:block;margin:6px 0 2px}
.tpl span{font-size:12px;color:var(--muted)}
.tpl .tpl-ic{font-size:22px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{font-size:22px;border:0;background:var(--hover);border-radius:8px;padding:6px;cursor:pointer}
.shortcuts{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13px}
/* menu, toast */
#menu{position:fixed;z-index:9800;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item.danger{color:var(--danger)}
.menu-item kbd{margin-left:auto}
.menu-item .ic{width:16px;height:16px;color:var(--muted)}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}
.color-row{display:flex;gap:5px;padding:6px 8px;flex-wrap:wrap}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.color-dot.none{background:var(--card);position:relative}
.color-dot.none::after{content:'';position:absolute;left:3px;right:3px;top:50%;height:2px;background:var(--danger);transform:rotate(-45deg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:9900;transition:.2s;font-size:13px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer}
[hidden]{display:none!important}
</style>
<style>
/* ===== Notes (Milanote-style canvas) ===== */
.notes-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);min-height:54px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex-wrap:wrap}
.crumb{border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex;gap:4px;align-items:center;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb .ic{width:15px;height:15px}
.crumb-sep{color:var(--muted)}
.board-title-input{font-size:17px;font-weight:700;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px;min-width:80px;width:260px;max-width:40vw;outline:0}
.board-title-input:hover:not(:disabled){border-color:var(--border)}
.board-title-input:focus{border-color:var(--accent)}
.notes-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.notes-body{flex:1;position:relative;display:flex;min-height:0}
.toolbar{width:72px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;z-index:5}
.tool{width:60px;border:0;background:none;border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;color:var(--muted);font-size:11px;touch-action:none;user-select:none}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.active{background:var(--accent-weak);color:var(--accent)}
.tool .ic{width:20px;height:20px}
.tool-sep{width:36px;height:1px;background:var(--border);margin:6px 0}
#canvas{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);touch-action:none;isolation:isolate;outline:0}
#canvas.line-mode{cursor:crosshair}
#canvas.panning,#canvas.panning *{cursor:grab!important}
#canvas.drop-hover{box-shadow:inset 0 0 0 3px var(--accent)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.line-vis{fill:none;stroke-width:2;stroke-linecap:round}
.line-vis.sel{stroke-width:3}
.line-arrow{stroke:none}
.line-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.line-label{font-size:13px;font-weight:500;fill:var(--text);paint-order:stroke;stroke:var(--canvas);stroke-width:6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.line-handle{fill:var(--panel);stroke:var(--accent);stroke-width:2;pointer-events:all;cursor:grab}
.line-temp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;z-index:99999}
#empty-hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:340px}
#empty-hint b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
.zoom-ctl{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;box-shadow:var(--shadow);z-index:6}
.zoom-ctl span{min-width:48px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
/* cards */
.card{position:absolute;background:var(--tint,var(--card));border-radius:6px;box-shadow:var(--shadow);color:var(--text);font-size:14px;line-height:1.45;user-select:none;-webkit-user-select:none}
.card.in-col{position:relative;left:auto!important;top:auto!important;width:auto!important}
.card.selected{outline:2px solid var(--accent);outline-offset:1px}
.card.dragging{box-shadow:var(--shadow-lg);opacity:.96;cursor:grabbing}
.card.drop-into{outline:3px solid var(--accent);outline-offset:3px}
.card img{pointer-events:none;-webkit-user-drag:none}
.color-red{--tint:var(--t-red);--cc:var(--cc-red)}.color-orange{--tint:var(--t-orange);--cc:var(--cc-orange)}.color-yellow{--tint:var(--t-yellow);--cc:var(--cc-yellow)}.color-green{--tint:var(--t-green);--cc:var(--cc-green)}.color-teal{--tint:var(--t-teal);--cc:var(--cc-teal)}.color-blue{--tint:var(--t-blue);--cc:var(--cc-blue)}.color-purple{--tint:var(--t-purple);--cc:var(--cc-purple)}.color-pink{--tint:var(--t-pink);--cc:var(--cc-pink)}.color-gray{--tint:var(--t-gray);--cc:var(--cc-gray)}
.card>.resize{position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize;opacity:0;z-index:2}
.card>.resize::after{content:'';position:absolute;right:4px;bottom:4px;width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.card:hover>.resize,.card.selected>.resize{opacity:1}
.card>.connector{position:absolute;right:-7px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);opacity:0;cursor:crosshair;z-index:2}
.card:hover>.connector{opacity:1}
.card>.card-more{position:absolute;top:4px;right:4px;width:24px;height:22px;border-radius:6px;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;opacity:0;color:var(--muted);z-index:3;padding:0}
.card>.card-more .ic{width:15px;height:15px}
.card:hover>.card-more,.card.selected>.card-more{opacity:1}
.card.is-editing>.card-more{opacity:0}
.ed{outline:0;min-height:1.45em;word-wrap:break-word;overflow-wrap:anywhere}
.ed.editing{user-select:text;-webkit-user-select:text;cursor:text}
.ed.is-empty::before{content:attr(data-ph);color:var(--muted);opacity:.7;pointer-events:none;float:left;height:0;white-space:nowrap}
.card:not(.selected) .ed.optional.is-empty:not(.editing){display:none}
.rt h1{font-size:20px;margin:.2em 0 .3em;line-height:1.25}
.rt h2{font-size:16.5px;margin:.2em 0 .3em}
.rt h3{font-size:14.5px;margin:.2em 0}
.rt p{margin:0}
.rt ul,.rt ol{margin:.2em 0;padding-left:1.4em}
.rt blockquote{margin:.3em 0;padding-left:10px;border-left:3px solid var(--cc,var(--border));color:var(--muted)}
.rt code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--hover);padding:1px 4px;border-radius:4px}
.rt mark{background:#ffe066;color:#1d1d1f;border-radius:2px;padding:0 1px}
.rt a{color:var(--accent)}
.rt hr{border:0;border-top:1px solid var(--border)}
.note-body{padding:12px 14px}
/* todo */
.t-todo{padding:10px 12px 8px}
.todo-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.todo-title{font-weight:700;flex:1}
.todo-count{font-size:12px;color:var(--muted);padding-top:2px}
.todo-progress{height:3px;background:var(--hover);border-radius:2px;margin:2px 0 6px;overflow:hidden}
.todo-progress i{display:block;height:100%;background:var(--success)}
.todo-item{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.todo-check{width:17px;height:17px;border-radius:4px;border:2px solid var(--muted);background:none;flex:none;margin-top:2px;cursor:pointer;padding:0;display:grid;place-items:center;color:#fff}
.todo-item.done .todo-check{background:var(--success);border-color:var(--success)}
.todo-item.done .todo-check::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo-text{flex:1}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-add{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 0;font-size:13px;opacity:0}
.card:hover .todo-add,.card.selected .todo-add{opacity:1}
/* link */
.t-link{overflow:hidden}
.link-thumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px 6px 0 0;overflow:hidden}
.link-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.link-thumb .play{position:absolute;inset:0;margin:auto;width:52px;height:36px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:16px}
.link-body{padding:10px 12px}
.link-host{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.link-host img{width:16px;height:16px;border-radius:3px}
.link-title{font-weight:600}
.link-desc{font-size:13px;color:var(--muted);margin-top:2px}
.link-url{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);text-decoration:none}
/* image/file */
.t-image{padding:0;overflow:hidden}
.t-image .img-wrap img,.t-sketch img{display:block;width:100%;height:auto}
.t-image .caption{padding:8px 10px;font-size:13px}
.t-file{display:flex;gap:10px;align-items:center;padding:12px}
.file-ext{width:40px;height:48px;border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;text-transform:uppercase}
.file-meta{min-width:0;flex:1}
.file-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:12px;color:var(--muted)}
/* column */
.t-column{background:var(--tint,var(--col-bg));padding:8px 8px 10px;box-shadow:none}
.t-column.color-red,.t-column.color-orange,.t-column.color-yellow,.t-column.color-green,.t-column.color-teal,.t-column.color-blue,.t-column.color-purple,.t-column.color-pink,.t-column.color-gray{background:color-mix(in srgb,var(--cc) 22%,var(--col-bg))}
.col-head{display:flex;align-items:center;gap:6px;padding:4px 30px 8px 6px}
.col-title{font-weight:700;flex:1}
.col-count{font-size:12px;color:var(--muted)}
.col-toggle{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:13px}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:44px}
.col-body.collapsed{display:none}
.col-empty{border:2px dashed color-mix(in srgb,var(--muted) 35%,transparent);border-radius:6px;padding:14px;text-align:center;font-size:12px;color:var(--muted)}
.drop-ph{height:0;margin-bottom:-8px;position:relative}
.drop-ph::after{content:'';position:absolute;left:0;right:0;top:-1px;height:3px;border-radius:2px;background:var(--accent)}
/* board card */
.t-board{padding:10px;text-align:center}
.board-icon{width:72px;height:72px;margin:4px auto 8px;border-radius:12px;background:var(--cc,var(--accent-weak));display:grid;place-items:center;font-size:32px}
.board-title{font-weight:600;font-size:13px}
.board-meta{font-size:11px;color:var(--muted)}
/* comment */
.t-comment{padding:10px 12px;border-left:4px solid var(--warn)}
.cm-item{padding:4px 0 8px}
.cm-meta{display:flex;align-items:center;gap:6px;font-size:12px}
.cm-meta .avatar{width:22px;height:22px;font-size:10px}
.cm-meta .muted{font-size:11px}
.cm-meta .x-btn{margin-left:auto}
.cm-text{font-size:13px;margin:3px 0 0 28px;white-space:pre-wrap}
.cm-input{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:6px 8px;resize:none;font-size:13px;outline:0}
.cm-input:focus{border-color:var(--accent)}
/* swatch */
.t-swatch{overflow:hidden}
.sw-block{height:96px;border-radius:6px 6px 0 0;position:relative}
.sw-input{position:absolute;opacity:0;width:1px;height:1px;left:50%;top:50%;pointer-events:none}
.sw-body{padding:8px 10px}
.sw-hex{font:600 13px ui-monospace,monospace}
.sw-name{font-size:12px;color:var(--muted)}
/* sketch, doc, record */
.t-sketch{background:#fff;overflow:hidden}
.sketch-empty{padding:34px 12px;text-align:center;color:#888;font-size:13px}
.t-doc{padding:14px}
.doc-ic{font-size:26px}
.doc-title{font-weight:700;margin:6px 0 4px}
.doc-snip{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.t-record{padding:12px}
.rec-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.rec-kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.rec-title{font-weight:700}
.rec-sub{font-size:12px;color:var(--muted)}
.rec-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-top:1px solid var(--border)}
.rec-row span{color:var(--muted)}
.rec-open{margin-top:8px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:12px}
/* floating bars */
#fmt,#linebar{position:fixed;z-index:9600;display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow-lg)}
#fmt button,#linebar button,.doc-bar button{border:0;background:none;min-width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);display:grid;place-items:center;padding:0 6px}
#fmt button:hover,#linebar button:hover,.doc-bar button:hover{background:var(--hover)}
#fmt button.on,#linebar button.on{background:var(--accent-weak);color:var(--accent)}
.fsep{width:1px;background:var(--border);margin:4px 2px}
#linebar .color-dot{width:18px;height:18px;margin:6px 2px}
#tool-ghost{position:fixed;z-index:9700;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow-lg);display:flex;gap:6px;align-items:center;font-size:13px;transform:translate(-50%,-50%)}
/* doc editor & sketch modal */
.doc-editor{display:flex;flex-direction:column;height:80vh}
.doc-bar{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.doc-bar .grow{flex:1}
.doc-title-in{font-size:26px;font-weight:700;border:0;outline:0;background:none;padding:22px 40px 6px}
.doc-body{flex:1;overflow:auto;padding:6px 40px 40px;outline:0;font-size:15px;line-height:1.6;user-select:text}
.sketch-wrap{display:flex;flex-direction:column}
.sketch-bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.sketch-bar .grow{flex:1}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.pen.on{box-shadow:0 0 0 2px var(--accent)}
.size-btn{border:1px solid var(--border);background:var(--panel);border-radius:6px;height:28px;min-width:28px;cursor:pointer}
.size-btn.on{border-color:var(--accent);color:var(--accent)}
.sketch-canvas{display:block;width:100%;height:auto;max-height:68vh;background:#fff;touch-action:none;cursor:crosshair;aspect-ratio:3/2;object-fit:contain}
.lightbox img{max-width:100%;max-height:80vh;display:block;margin:auto;border-radius:8px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
/* responsive */
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #nav{width:100%;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);justify-content:space-around;overflow-x:auto;overflow-y:hidden}
  .brand,.nav-label,#nav-boards,.nav-spacer,.save-state,.nav-item kbd{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;width:auto;flex:1;align-items:center;min-width:52px}
  .view{padding:18px 16px 32px}
  .search-field{min-width:0;flex:1}
  .form-grid{grid-template-columns:1fr}
  .notes-body{flex-direction:column-reverse}
  .toolbar{width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--border);overflow-x:auto;padding:4px;justify-content:flex-start}
  .tool{width:auto;min-width:56px;flex:none}
  .tool-sep{width:1px;height:30px;margin:0 4px}
  .board-title-input{width:150px}
  .notes-actions .btn span{display:none}
  .zoom-ctl{bottom:84px;right:10px}
  .dash-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app">
  <aside id="nav"></aside>
  <main id="main">
    <section id="view-dashboard" class="view"></section>
    <section id="view-contacts" class="view"></section>
    <section id="view-companies" class="view"></section>
    <section id="view-deals" class="view"></section>
    <section id="view-tasks" class="view"></section>

        <span id="board-link"></span>
        <div class="notes-actions">
          <button class="icon-btn" data-act="undo" title="Undo (Ctrl+Z)" id="btn-undo"></button>
          <button class="icon-btn" data-act="redo" title="Redo (Ctrl+Shift+Z)" id="btn-redo"></button>
          <button class="btn" data-act="templates" id="btn-tpl"></button>
          <button class="icon-btn" data-act="board-menu" title="Board options" id="btn-bmenu"></button>

        <div class="toolbar" id="toolbar"></div>
        <div id="canvas" tabindex="-1">
          <div id="world">
            <svg id="lines" xmlns="http://www.w3.org/2000/svg"><g id="lines-g"></g></svg>
            <div id="cards"></div>
          </div>
          <div id="marquee" hidden></div>
          <div id="empty-hint" hidden><b>This board is empty</b>Drag something from the toolbar, double-click to add a note, or drop images and files here.</div>
        </div>
        <div class="zoom-ctl">
          <button class="icon-btn" data-act="zoom-out" title="Zoom out" id="btn-zo"></button>
          <span id="zoom-pct" data-act="zoom-reset" title="Reset zoom">100%</span>
          <button class="icon-btn" data-act="zoom-in" title="Zoom in" id="btn-zi"></button>
          <button class="icon-btn" data-act="zoom-fit" title="Fit to content" id="btn-zf"></button>

      </div>

</div>
<aside id="drawer" aria-label="Record details"></aside>
<div id="fmt" hidden></div>
<div id="linebar" hidden></div>
<div id="menu" hidden></div>
<div id="tool-ghost" hidden></div>
<div id="toast" role="status"></div>
<div id="modal-root"></div>

/* ================= Storage (IndexedDB with localStorage fallback) ================= */
const Store = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      try { const r = indexedDB.open('northstar-crm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return this.p;
  },
  async get(k) {
    try { const d = await this.open(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch { try { const v = localStorage.getItem('ns:' + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; } }
  },
  async set(k, v) {
    try { const d = await this.open(); await new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
    catch { try { localStorage.setItem('ns:' + k, JSON.stringify(v)); } catch { toast('Storage is full — export a backup from Settings'); } }
  }
};

  if (e.code === 'Space' && !spaceDown) { spaceDown = true; canvas.classList.add('panning'); e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }

    e.preventDefault(); const s = e.shiftKey ? 20 : 4; const dx = e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, dy = e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0;

/* ================= Navigation ================= */

function nav(hash) { try { if (location.hash !== hash) history.pushState(null, '', hash); } catch { } }
function setView(v, push = true) {

function route() {

/* ================= Lists (contacts, companies) ================= */
function renderList(kind) {
  const K = KINDS[kind], root = $('#view-' + K.view), all = db[K.store];
  const q = (UI.q[kind] || '').toLowerCase(), f = UI.filter[kind] || '', s = UI.sort[kind] || { k: K.cols[0].k, dir: 1 };
  const col = K.cols.find(c => c.k === s.k) || K.cols[0];
  const sv = r => col.sv ? col.sv(r) : col.v ? col.v(r) : r[col.k];
  const rows = all.filter(r => (!q || K.search(r).toLowerCase().includes(q)) && (!f || r[K.filter.k] === f))
    .sort((a, b) => { const x = sv(a), y = sv(b); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''))) * s.dir; });
  const focused = document.activeElement?.dataset?.q === kind;
  root.innerHTML = `<header class="page-head"><div><h1>${K.plural}</h1><p class="muted">${rows.length} of ${all.length}</p></div><div class="head-actions"><button class="btn primary" data-new="${kind}">${icon('plus')} New ${K.label.toLowerCase()}</button></div></header>
  <div class="list-tools"><div class="search-field">${icon('search')}<input type="search" data-q="${kind}" placeholder="Search ${K.plural.toLowerCase()}…" value="${esc(UI.q[kind] || '')}"></div>
  ${K.filter ? `<select class="inp" data-filter="${kind}"><option value="">All ${K.filter.label}</option>${K.filter.o.map(o => `<option ${o === f ? 'selected' : ''}>${o}</option>`).join('')}</select>` : ''}</div>
  <div class="table-wrap"><table class="table"><thead><tr>${K.cols.map(c => `<th data-sort="${kind}:${c.k}" class="${s.k === c.k ? 'sorted' : ''}">${c.l}${s.k === c.k ? (s.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr data-open="${kind}:${r.id}">${K.cols.map(c => `<td>${c.html ? c.html(r) : esc(c.v ? c.v(r) : r[c.k])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${K.cols.length}" class="empty">No ${K.plural.toLowerCase()} match.</td></tr>`}</tbody></table></div>`;
  if (focused) { const i = root.querySelector('[data-q]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

const dealsView = $('#view-deals');
dealsView.addEventListener('dragstart', e => { const c = e.target.closest('.kcard'); if (c) { e.dataTransfer.setData('text/deal', c.dataset.deal); e.dataTransfer.effectAllowed = 'move'; } });
dealsView.addEventListener('dragover', e => { const col = e.target.closest('.kcol'); if (col && [...e.dataTransfer.types].includes('text/deal')) { e.preventDefault(); $$('.kcol.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });

/* ================= Tasks ================= */
function renderTasks() {
  const td = todayStr(), tab = UI.taskTab;
  const filt = { open: t => !t.done, today: t => !t.done && t.due === td, overdue: t => !t.done && t.due && t.due < td, upcoming: t => !t.done && t.due > td, done: t => t.done };
  const list = db.tasks.filter(filt[tab]).sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority));
  const groups = tab === 'open' ? [['Overdue', list.filter(filt.overdue)], ['Today', list.filter(filt.today)], ['Upcoming', list.filter(filt.upcoming)], ['No date', list.filter(t => !t.due)]] : [[null, list]];
  const row = t => `<div class="task-row${t.done ? ' done' : ''}"><input type="checkbox" data-task-toggle="${t.id}" ${t.done ? 'checked' : ''} aria-label="Complete"><input class="t-title" data-task-field="title" data-id="${t.id}" value="${esc(t.title)}" aria-label="Task title">
    ${t.refId && refLabel(t.kind, t.refId) ? `<button class="chip" data-open="${t.kind}:${t.refId}">${esc(refLabel(t.kind, t.refId))}</button>` : ''}
    <select data-task-field="priority" data-id="${t.id}" aria-label="Priority">${PRIORITIES.map(p => `<option ${p === t.priority ? 'selected' : ''}>${p}</option>`).join('')}</select>
    <input type="date" class="t-due${t.due && t.due < td && !t.done ? ' overdue' : ''}" data-task-field="due" data-id="${t.id}" value="${esc(t.due || '')}" aria-label="Due date">
    <button class="x-btn" data-task-del="${t.id}" title="Delete task">${icon('x')}</button></div>`;
  const counts = Object.fromEntries(Object.entries(filt).map(([k, f]) => [k, db.tasks.filter(f).length]));
  $('#view-tasks').innerHTML = `<header class="page-head"><div><h1>Tasks</h1><p class="muted">${counts.open} open · ${counts.overdue} overdue</p></div></header>
  <form class="task-add" data-form="task"><input class="inp" name="title" placeholder="Add a task and press Enter…" required><input class="inp" type="date" name="due" value="${todayStr()}"><select class="inp" name="priority">${PRIORITIES.map(p => `<option ${p === 'Medium' ? 'selected' : ''}>${p}</option>`).join('')}</select><button class="btn primary">${icon('plus')} Add</button></form>
  <div class="tabs">${[['open', 'All open'], ['today', 'Today'], ['overdue', 'Overdue'], ['upcoming', 'Upcoming'], ['done', 'Completed']].map(([k, l]) => `<button class="tab${tab === k ? ' on' : ''}" data-tab="${k}">${l} <span class="muted">${counts[k]}</span></button>`).join('')}</div>
  ${groups.filter(g => g[1].length).map(([name, ts]) => `${name ? `<div class="task-group">${name}</div>` : ''}<div class="task-list">${ts.map(row).join('')}</div>`).join('') || '<div class="empty panel">No tasks here.</div>'}`;
}
function toggleTask(id) {
  const t = db.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  if (t.done && t.refId) logActivity(t.kind, t.refId, 'task', 'Completed task: ' + t.title);
  save(); renderCurrent(); if (UI.drawer) renderDrawer();

/* ================= Record drawer ================= */
function boardFor(kind, id) { return Object.values(db.boards).find(b => b.link && b.link.kind === kind && b.link.id === id); }
function ensureCrmContainer() {
  if (db.crmBoardId && db.boards[db.crmBoardId]) return db.boards[db.crmBoardId];
  const root = db.rootBoardId, ex = topCards(root);
  const c = createCard('board', ex.length ? Math.min(...ex.map(x => x.x)) : 0, ex.length ? Math.max(...ex.map(x => x.y)) + 260 : 0, { title: 'CRM notes' }, { boardId: root, color: 'blue' });
  db.boards[c.data.boardId].icon = '🗂️'; db.crmBoardId = c.data.boardId; return db.boards[c.data.boardId];
}
function ensureBoard(kind, id) {
  let b = boardFor(kind, id); if (b) return b;
  const r = getRec(kind, id), K = KINDS[kind], cont = ensureCrmContainer();
  checkpoint();
  const n = topCards(cont.id).filter(c => c.type === 'board').length;
  const card = createCard('board', (n % 5) * 160, Math.floor(n / 5) * 190, { title: K.title(r) }, { boardId: cont.id });
  b = db.boards[card.data.boardId]; b.icon = { contact: '👤', company: '🏢', deal: '💼' }[kind]; b.link = { kind, id };
  createCard('record', 0, 0, { kind, refId: id }, { boardId: b.id });
  createCard('note', 300, 0, { html: `<h2>Notes on ${esc(K.title(r))}</h2><div>Context, goals, and anything worth remembering.</div>` }, { boardId: b.id, color: 'yellow' });
  createCard('todo', 580, 0, { title: 'Next steps', items: [{ id: uid('i'), text: '', done: false }] }, { boardId: b.id });
  logActivity(kind, id, 'system', 'Created notes board'); save(); return b;
}
function openRecord(kind, id) { if (!getRec(kind, id)) return; UI.drawer = { kind, id }; renderDrawer(); $('#drawer').classList.add('open'); }
function closeDrawer() { UI.drawer = null; $('#drawer').classList.remove('open'); }
function fieldHtml(f, r) {
  const v = r[f.k] ?? '', a = `class="inp" data-field="${f.k}"`;
  let input;

  else if (f.t === 'company') input = `<select ${a}><option value="">— None —</option>${db.companies.map(c => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if (f.t === 'contact') input = `<select ${a}><option value="">— None —</option>${db.contacts.map(c => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if (f.t === 'textarea') input = `<textarea ${a} placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else input = `<input ${a} type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  return `<label class="${f.full ? 'full' : ''}">${f.l}${input}</label>`;
}
function renderDrawer() {
  if (!UI.drawer) return;
  const { kind, id } = UI.drawer, K = KINDS[kind], r = getRec(kind, id); if (!r) { closeDrawer(); return; }
  const rel = [];
  if (kind === 'contact') { rel.push(['Deals', db.deals.filter(d => d.contactId === id).map(d => ['deal', d.id, d.title, money(d.value) + ' · ' + d.stage])]); if (r.companyId) rel.push(['Company', [['company', r.companyId, companyName(r.companyId), '']]]); }
  if (kind === 'company') { rel.push(['People', db.contacts.filter(c => c.companyId === id).map(c => ['contact', c.id, c.name, c.title])]); rel.push(['Deals', db.deals.filter(d => d.companyId === id).map(d => ['deal', d.id, d.title, money(d.value) + ' · ' + d.stage])]); }
  if (kind === 'deal') { if (r.contactId) rel.push(['Contact', [['contact', r.contactId, contactName(r.contactId), '']]]); if (r.companyId) rel.push(['Company', [['company', r.companyId, companyName(r.companyId), '']]]); }
  const tasks = db.tasks.filter(t => t.kind === kind && t.refId === id), acts = db.activities.filter(a => a.kind === kind && a.refId === id), board = boardFor(kind, id);
  $('#drawer').innerHTML = `
  <div class="drawer-head"><div class="avatar lg kind-${kind}">${kind === 'deal' ? icon('dollar') : esc(initials(K.title(r)))}</div><div class="dh-text"><div class="eyebrow">${K.label}</div><h2 id="dr-title">${esc(K.title(r))}</h2><div class="muted" id="dr-sub">${esc(K.sub(r))}</div></div><button class="icon-btn" data-act="close-drawer" title="Close">${icon('x')}</button></div>
  <div class="drawer-actions"><button class="btn primary" data-act="record-board">${icon('layers')} ${board ? 'Open notes board' : 'Create notes board'}</button><button class="btn danger" data-act="delete-record">${icon('trash')} Delete</button></div>
  <div class="drawer-body">
    <section><h3>Details</h3><div class="form-grid">${K.fields.map(f => fieldHtml(f, r)).join('')}</div></section>
    ${rel.filter(x => x[1].length).map(([t, items]) => `<section><h3>${t}</h3>${items.map(([k, i, n, s]) => `<div class="mini-row"><span class="avatar sm kind-${k}">${k === 'deal' ? icon('dollar') : esc(initials(n))}</span><span class="grow"><b>${esc(n)}</b> <span class="muted">${esc(s || '')}</span></span><button class="chip" data-open="${k}:${i}">Open</button></div>`).join('')}</section>`).join('')}
    <section><h3>Tasks</h3>${tasks.map(t => `<div class="mini-row${t.due && t.due < todayStr() && !t.done ? ' overdue' : ''}"><input type="checkbox" data-task-toggle="${t.id}" ${t.done ? 'checked' : ''} aria-label="Complete"><span class="grow" style="${t.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}</span><span class="due muted">${fmtDate(t.due)}</span><button class="x-btn" data-task-del="${t.id}">${icon('x')}</button></div>`).join('')}
      <form class="composer-row" data-form="drawer-task" style="margin-top:8px"><input class="inp" name="title" placeholder="Add a task…" required><input class="inp" type="date" name="due" value="${dateAdd(1)}" style="width:150px"><button class="btn">Add</button></form></section>
    <section><h3>Activity</h3><form class="composer" data-form="activity"><textarea class="inp" name="text" placeholder="Log a note, call, email or meeting…" required></textarea><div class="composer-row"><select class="inp" name="type"><option value="note">📝 Note</option><option value="call">📞 Call</option><option value="email">✉️ Email</option><option value="meeting">👥 Meeting</option></select><span style="flex:1"></span><button class="btn primary">Log activity</button></div></form>
      ${acts.map(a => `<div class="timeline-item"><span class="act-ic">${ACT_IC[a.type] || '•'}</span><div class="ti-text">${esc(a.text)}<div class="ti-meta">${a.type} · ${timeAgo(a.at)}</div></div><button class="x-btn" data-act-del="${a.id}" title="Delete">${icon('x')}</button></div>`).join('') || '<div class="muted" style="font-size:13px">No activity yet.</div>'}</section>
  </div>`;
}
async function deleteRecord(kind, id) {
  const K = KINDS[kind], r = getRec(kind, id);
  if (!await confirmModal(`Delete ${K.label.toLowerCase()} “${K.title(r)}”? Related tasks and activity will be removed too.`, 'Delete')) return;
  db[K.store] = db[K.store].filter(x => x.id !== id);
  db.tasks = db.tasks.filter(t => !(t.kind === kind && t.refId === id)); db.activities = db.activities.filter(a => !(a.kind === kind && a.refId === id));
  for (const c of db.contacts) if (kind === 'company' && c.companyId === id) c.companyId = '';
  for (const d of db.deals) { if (kind === 'company' && d.companyId === id) d.companyId = ''; if (kind === 'contact' && d.contactId === id) d.contactId = ''; }
  const b = boardFor(kind, id); if (b) b.link = null;
  closeDrawer(); save(); renderCurrent(); toast(`${K.label} deleted`);
}
function newRecord(kind) {
  const K = KINDS[kind], r = { id: uid(kind.slice(0, 2) + '_'), ...K.blank(), createdAt: Date.now() };
  db[K.store].unshift(r); logActivity(kind, r.id, 'system', `${K.label} created`); save();
  if (UI.view !== 'notes' && UI.view !== 'dashboard') setView(K.view); else renderCurrent();
  openRecord(kind, r.id); requestAnimationFrame(() => $('#drawer [data-field]')?.focus());
}

/* ================= Delegated events ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nav],[data-open],[data-board],[data-new],[data-act],[data-sort],[data-task-del],[data-act-del],[data-tab]');
  if (!t || t.closest('#canvas')) return;
  const d = t.dataset;
  if (d.nav) { if (d.nav === 'notes') openBoard(N.boardId || db.rootBoardId); else setView(d.nav); }
  else if (d.open) { const [k, i] = d.open.split(':'); openRecord(k, i); }
  else if (d.board) { closeDrawer(); openBoard(d.board); }
  else if (d.new) newRecord(d.new);
  else if (d.sort) { const [k, f] = d.sort.split(':'); const s = UI.sort[k] || { k: KINDS[k].cols[0].k, dir: 1 }; UI.sort[k] = { k: f, dir: s.k === f ? -s.dir : 1 }; renderList(k); }
  else if (d.taskDel) { db.tasks = db.tasks.filter(x => x.id !== d.taskDel); save(); renderCurrent(); renderDrawer(); }
  else if (d.actDel) { db.activities = db.activities.filter(x => x.id !== d.actDel); save(); renderDrawer(); }
  else if (d.tab) { UI.taskTab = d.tab; renderTasks(); }
  else if (d.act) {
    switch (d.act) {
      case 'search': openSearch(); break;
      case 'settings': openSettings(); break;
      case 'close-drawer': closeDrawer(); break;
      case 'record-board': { const { kind, id } = UI.drawer; const b = ensureBoard(kind, id); closeDrawer(); openBoard(b.id); break; }
      case 'delete-record': deleteRecord(UI.drawer.kind, UI.drawer.id); break;
      case 'undo': undo(); break;
      case 'redo': redo(); break;
      case 'templates': openTemplates(); break;
      case 'board-menu': { const r = t.getBoundingClientRect(); showBoardMenu(r.right - 220, r.bottom + 6); break; }
      case 'zoom-in': zoomAt(view().z * 1.2); break;
      case 'zoom-out': zoomAt(view().z / 1.2); break;
      case 'zoom-reset': zoomAt(1); break;
      case 'zoom-fit': fitView(); break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { UI.q[t.dataset.q] = t.value; t.dataset.q === 'deal' ? renderDeals() : renderList(t.dataset.q); }
  if (t.id === 'board-title') { const b = curBoard(); b.title = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) { UI.filter[t.dataset.filter] = t.value; renderList(t.dataset.filter); }
  else if (t.dataset.taskToggle) toggleTask(t.dataset.taskToggle);
  else if (t.dataset.taskField) { const k = db.tasks.find(x => x.id === t.dataset.id); if (k) { k[t.dataset.taskField] = t.value; save(); if (t.dataset.taskField !== 'title') renderTasks(); } }
  else if (t.dataset.field && t.closest('#drawer') && UI.drawer) {
    const { kind, id } = UI.drawer, r = getRec(kind, id), f = t.dataset.field;
    if (kind === 'deal' && f === 'stage') setDealStage(r, t.value); else r[f] = f === 'value' ? (+t.value || 0) : t.value;
    const b = boardFor(kind, id); if (b && (f === 'name' || f === 'title')) b.title = KINDS[kind].title(r);
    $('#dr-title').textContent = KINDS[kind].title(r); $('#dr-sub').textContent = KINDS[kind].sub(r);
    save(); renderCurrent();
  }
  else if (t.id === 'board-title') renderNavBoards();
});
document.addEventListener('submit', e => {
  const f = e.target, fd = new FormData(f); e.preventDefault();
  if (f.dataset.form === 'task') { db.tasks.push({ id: uid('tk_'), title: fd.get('title').trim(), due: fd.get('due'), priority: fd.get('priority'), kind: '', refId: '', done: false, createdAt: Date.now() }); save(); renderTasks(); $('#view-tasks [name=title]')?.focus(); }
  else if (f.dataset.form === 'drawer-task') { const { kind, id } = UI.drawer; db.tasks.push({ id: uid('tk_'), title: fd.get('title').trim(), due: fd.get('due'), priority: 'Medium', kind, refId: id, done: false, createdAt: Date.now() }); save(); renderDrawer(); renderCurrent(); }
  else if (f.dataset.form === 'activity') { const { kind, id } = UI.drawer; logActivity(kind, id, fd.get('type'), fd.get('text').trim()); save(); renderDrawer(); renderCurrent(); }
});

/* ================= Modals ================= */
function modal(content, opts = {}) {
  const wrap = h('div', { class: 'modal-wrap' + (opts.top ? ' top' : '') }), box = h('div', { class: 'modal' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true' });
  if (typeof content === 'string') box.innerHTML = content; else box.append(content);
  wrap.append(box);
  const close = () => { if (!wrap.isConnected) return; wrap.remove(); opts.onClose?.(); };
  wrap.addEventListener('pointerdown', e => { if (e.target === wrap) close(); });
  wrap._close = close; box.close = close;
  $('#modal-root').append(wrap); return box;
}
function closeTopModal() { const w = $('#modal-root').lastElementChild; if (w) { w._close(); return true; } return false; }
function promptModal({ title, value = '', placeholder = '', okLabel = 'OK' }) {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h2>${esc(title)}</h2><form><input class="inp" value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="modal-actions"><button type="button" class="btn" data-c>Cancel</button><button class="btn primary">${esc(okLabel)}</button></div></form>`, { onClose: () => { if (!done) res(null); } });
    const inp = m.querySelector('input'); inp.focus(); inp.select();
    m.querySelector('[data-c]').onclick = () => m.close();
    m.querySelector('form').onsubmit = e => { e.preventDefault(); done = true; res(inp.value.trim()); m.close(); };
  });
}
function confirmModal(msg, okLabel = 'Confirm') {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h2>Are you sure?</h2><p class="muted">${esc(msg)}</p><div class="modal-actions"><button class="btn" data-c>Cancel</button><button class="btn primary" data-ok style="background:var(--danger);border-color:var(--danger)">${esc(okLabel)}</button></div>`, { onClose: () => { if (!done) res(false); } });
    m.querySelector('[data-c]').onclick = () => m.close();
    const ok = m.querySelector('[data-ok]'); ok.onclick = () => { done = true; res(true); m.close(); }; ok.focus();
  });
}
function pickRecord() {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h2>Add a CRM record to this board</h2><div class="search-field">${icon('search')}<input placeholder="Search contacts, companies, deals…"></div><div class="pick-list"></div>`, { onClose: () => { if (!done) res(null); } });
    const inp = m.querySelector('input'), list = m.querySelector('.pick-list');
    const draw = () => {
      const q = inp.value.toLowerCase();
      list.innerHTML = ['contact', 'company', 'deal'].map(k => { const K = KINDS[k]; const rs = db[K.store].filter(r => !q || K.search(r).toLowerCase().includes(q)).slice(0, 8); return rs.length ? `<div class="sr-group">${K.plural}</div>` + rs.map(r => `<div class="sr-item" data-k="${k}" data-i="${r.id}"><span class="avatar sm kind-${k}">${k === 'deal' ? icon('dollar') : esc(initials(K.title(r)))}</span><div><div class="sr-t">${esc(K.title(r))}</div><div class="sr-s">${esc(K.sub(r))}</div></div></div>`).join('') : ''; }).join('') || '<div class="empty">No records found</div>';
    };
    inp.oninput = draw; draw(); inp.focus();
    list.onclick = e => { const it = e.target.closest('.sr-item'); if (!it) return; done = true; res({ kind: it.dataset.k, refId: it.dataset.i }); m.close(); };
  });
}
function openSearch() {
  if ($('.search-modal')) return;
  const m = modal(`<div class="search-field">${icon('search')}<input placeholder="Search contacts, deals, boards and notes…" aria-label="Search"></div><div class="search-results"></div><div class="search-foot muted">↑ ↓ to move · Enter to open · Esc to close</div>`, { cls: 'search-modal' });
  const inp = m.querySelector('input'), res = m.querySelector('.search-results'); let items = [], idx = 0;
  const run = () => {
    const q = inp.value.trim().toLowerCase(); items = [];
    const push = (group, title, sub, go, ic) => items.push({ group, title, sub, go, ic });
    for (const k of ['contact', 'company', 'deal']) { const K = KINDS[k]; db[K.store].filter(r => q ? K.search(r).toLowerCase().includes(q) : false).slice(0, 5).forEach(r => push(K.plural, K.title(r), K.sub(r), () => openRecord(k, r.id), k === 'deal' ? '💼' : k === 'company' ? '🏢' : '👤')); }
    if (q) db.tasks.filter(t => t.title.toLowerCase().includes(q)).slice(0, 4).forEach(t => push('Tasks', t.title, fmtDate(t.due), () => setView('tasks'), t.done ? '✅' : '⬜'));
    Object.values(db.boards).filter(b => !q || (b.title || '').toLowerCase().includes(q)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, q ? 5 : 6).forEach(b => push(q ? 'Boards' : 'Recent boards', b.title || 'Untitled board', boardCards(b.id).length + ' cards', () => openBoard(b.id), b.icon || '📁'));
    if (q) Object.values(db.cards).filter(c => c.type !== 'board' && cardText(c).toLowerCase().includes(q)).slice(0, 8).forEach(c => { const t = cardText(c), i = t.toLowerCase().indexOf(q); push('Cards', t.slice(Math.max(0, i - 20), i + 60) || cardLabel(c), cardLabel(c) + ' in ' + (db.boards[c.boardId]?.title || 'Untitled board'), () => openBoard(c.boardId, c.columnId || c.id), '🗒️'); });
    idx = 0; draw();
  };
  const draw = () => {
    let g = ''; res.innerHTML = items.map((it, i) => { const head = it.group !== g ? `<div class="sr-group">${esc(it.group)}</div>` : ''; g = it.group; return head + `<div class="sr-item${i === idx ? ' on' : ''}" data-i="${i}"><span style="font-size:18px">${it.ic}</span><div style="min-width:0"><div class="sr-t">${esc(it.title)}</div><div class="sr-s">${esc(it.sub || '')}</div></div></div>`; }).join('') || '<div class="empty">No results</div>';
    res.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
  };
  const go = i => { const it = items[i]; if (!it) return; m.close(); it.go(); };
  inp.oninput = run;
  inp.onkeydown = e => { if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); draw(); } else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); } else if (e.key === 'Enter') { e.preventDefault(); go(idx); } };
  res.onclick = e => { const it = e.target.closest('.sr-item'); if (it) go(+it.dataset.i); };
  run(); inp.focus();
}
function applyTheme() { const t = db.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function openSettings() {
  const m = modal(`<h2>Settings</h2><div class="form-grid"><label class="full">Your name (shown on comments)<input class="inp" name="user" value="${esc(db.settings.user || '')}"></label><label class="full">Theme<select class="inp" name="theme">${[['auto', 'Match system'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<option value="${v}" ${db.settings.theme === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
  <h2 style="margin-top:22px">Data</h2><p class="muted" style="font-size:13px;margin-top:-6px">Everything is stored in this browser. Export a backup to move it or keep it safe.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-x="export">${icon('download')} Export backup</button><button class="btn" data-x="import">${icon('upload')} Import backup</button><button class="btn" data-x="shortcuts">${icon('keyboard')} Shortcuts</button><button class="btn danger" data-x="reset">Reset demo data</button></div>
  <div class="modal-actions"><button class="btn primary" data-x="close">Done</button></div>`);
  m.querySelector('[name=user]').oninput = e => { db.settings.user = e.target.value; save(); };
  m.querySelector('[name=theme]').onchange = e => { db.settings.theme = e.target.value; applyTheme(); save(); };
  m.addEventListener('click', async e => {
    const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return;
    if (x === 'close') { m.close(); renderCurrent(); }
    if (x === 'shortcuts') showShortcuts();
    if (x === 'export') downloadText(`northstar-backup-${todayStr()}.json`, JSON.stringify({ kind: 'northstar-backup', db, assets }));
    if (x === 'import') {
      const [f] = await pickFiles('.json,application/json', false); if (!f) return;
      try { const o = JSON.parse(await readFile(f, 'text')); if (o.kind !== 'northstar-backup' || !o.db?.boards) throw 0; if (!await confirmModal('Replace all current data with this backup?', 'Replace')) return; db = o.db; assets = o.assets || {}; await Store.set('db', db); await Store.set('assets', assets); location.reload(); }
      catch { toast('That is not a valid Northstar backup'); }
    }
    if (x === 'reset') { if (!await confirmModal('Erase everything and restore the demo data?', 'Reset')) return; db = seed(); assets = {}; await Store.set('db', db); await Store.set('assets', assets); location.hash = ''; location.reload(); }
  });
}
function toast(msg, action) {
  const t = $('#toast'); t.innerHTML = ''; t.append(h('span', {}, msg));
  if (action) t.append(h('button', { onclick: () => { t.classList.remove('show'); action.run(); } }, action.label));
  t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ================= Init ================= */
(async function init() {
  buildNav(); buildToolbar();
  [['#btn-undo', 'undo'], ['#btn-redo', 'redo'], ['#btn-bmenu', 'more'], ['#btn-zo', 'minus'], ['#btn-zi', 'plus'], ['#btn-zf', 'fit']].forEach(([s, i]) => $(s).innerHTML = icon(i));
  $('#btn-tpl').innerHTML = icon('template') + '<span>Templates</span>';
  db = await Store.get('db'); assets = (await Store.get('assets')) || {};
  if (!db || !db.version || !db.boards || !db.boards[db.rootBoardId]) { db = seed(); assets = {}; save(); }
  db.settings = db.settings || { user: 'You', theme: 'auto' };
  // prune assets no card references
  const used = new Set(Object.values(db.cards).map(c => c.data && c.data.assetId).filter(Boolean));
  let pruned = false; for (const k of Object.keys(assets)) if (!used.has(k)) { delete assets[k]; pruned = true; } if (pruned) saveAssets();
  N.boardId = db.rootBoardId;
  applyTheme(); route();
  window.addEventListener('resize', () => { scheduleLines(); positionFmt(); });
})();
</script>
